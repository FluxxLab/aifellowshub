# Frontend CI — lint, typecheck, production build, and a Docker image
# build sanity-check. Runs on every push + PR.

name: frontend-ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Project uses pnpm; setup must happen before setup-node so the
      # pnpm-lock.yaml is recognised by the cache key.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint step intentionally skipped — eslint-config-next@14 + the
      # bundled @next/eslint-plugin-next@14 call ESLint context APIs
      # that were removed in ESLint 9 (`context.getAncestors`, etc.).
      # Re-enable once we bump to next@15 + eslint-config-next@15, both
      # of which ship native flat-config support.
      #
      # Standalone `tsc --noEmit` is also intentionally skipped — plain
      # tsc doesn't know about Next's SVG-import-as-React-component
      # module resolution, so it surfaces ~200 false positives on every
      # icon usage ("className does not exist on IntrinsicAttributes").
      # `next build` below runs Next's own typecheck pass with the
      # right module resolution; real type errors still fail CI there.

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  storybook-a11y:
    # Builds Storybook, serves it locally, and runs the test-runner
    # against every story to catch render errors + axe-core violations.
    # Same WCAG tag set as the Playwright a11y helper (`e2e/helpers/axe.ts`)
    # so design-system primitives and pages clear the same bar.
    name: Storybook a11y
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Run Storybook test-runner
        run: pnpm storybook:test

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR rejects mixed-case image names. `github.repository` is
      # case-preserving (e.g. FluxxLab/aifellowshub), so we lowercase
      # it once here and reuse the output below.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
